<div class="mb-3">
    <label class="form-label fw-semibold" for="{{ campo.id_for_label }}">
        {{ campo.label }}
        {% if campo.field.required %}<span class="text-danger" aria-hidden="true"> *</span>{% endif %}
    </label>
    {{ campo }}
    {% if campo.help_text %}<div class="form-text">{{ campo.help_text }}</div>{% endif %}
    {% for error in campo.errors %}
    <div class="invalid-feedback d-block">{{ error }}</div>
    {% endfor %}
</div>
