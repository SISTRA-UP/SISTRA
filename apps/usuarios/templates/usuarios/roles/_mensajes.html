{% if messages %}
  {% for mensaje in messages %}
    <div class="alert alert-{% if mensaje.tags == 'error' %}danger{% elif mensaje.tags %}{{ mensaje.tags }}{% else %}info{% endif %} alert-dismissible fade show"
         role="alert">
      {{ mensaje }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
  {% endfor %}
{% endif %}
